@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101913;--ink:#e4eee1;--muted:#97a89b;--line:#2a3a2f;--card:#18241c;--accent:#7fcf9f;--on-accent:#0e1a12;--flash:#c9e46b;--flash-ink:#16210f;color-scheme:dark}}

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}

th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}

tr.earned td{color:var(--muted)}

async function load() {
  try {
    const r = await fetch("dragon.json", { cache: "no-store" });
    if (r.ok) { const d = await r.json(); if (Array.isArray(d) && d.length) return d; }
  } catch (e) { /* use the built-in list */ }
  return SEED;
}

const $ = (id) => document.getElementById(id);
const fmt = (n) => n.toLocaleString("en-US");
const same = (a, b) => a.item === b.item && a.qty === b.qty;

function run(rows) {
  // Rewards identical on every row are shown once, not repeated in each row.
  const shared = rows[0].rewards.slice(1).filter((f, i) => rows.every((r) => r.rewards[i + 1] && same(r.rewards[i + 1], f)));
  const own = (r) => r.rewards.filter((x) => !shared.some((s) => same(s, x)));
  const text = (r) => own(r).map((x) => x.item + " ×" + fmt(x.qty)).join(" + ");
  $("shared").textContent = shared.length ? "Every milestone also gives: " + shared.map((x) => x.item + " ×" + fmt(x.qty)).join(", ") + "." : "";

  const tbody = $("rows");
  for (const r of rows) {
    const tr = document.createElement("tr"); tr.dataset.orbs = r.orbs;
    const a = document.createElement("td"); a.className = "n"; a.textContent = fmt(r.orbs);
    const b = document.createElement("td");
    for (const x of own(r)) { const d = document.createElement("div"); d.textContent = x.item + " ×" + fmt(x.qty); b.appendChild(d); }
    tr.append(a, b); tbody.appendChild(tr);
  }

  const totals = (list) => {
    const m = new Map();
    for (const r of list) for (const x of r.rewards) m.set(x.item, (m.get(x.item) || 0) + x.qty);
    return [...m].sort((p, q) => p[0].localeCompare(q[0]));
  };
  const fill = (ul, list) => {
    ul.textContent = "";
    if (!list.length) { const li = document.createElement("li"); li.textContent = "Nothing yet"; ul.appendChild(li); return; }
    for (const [item, qty] of list) {
      const li = document.createElement("li"), a = document.createElement("span"), b = document.createElement("span");
      a.textContent = item; b.textContent = "×" + fmt(qty); li.append(a, b); ul.appendChild(li);
    }
  };

  function update() {
    const used = Math.max(0, Math.floor(Number($("used").value) || 0));
    const goal = Math.max(0, Math.floor(Number($("goal").value) || 0));
    const next = rows.find((r) => r.orbs > used);
    $("next").textContent = next ? "Next: " + text(next) + " at " + fmt(next.orbs) + " orbs (" + fmt(next.orbs - used) + " more)" : "You’ve reached every listed milestone.";
    fill($("earned"), totals(rows.filter((r) => r.orbs <= used)));
    const showGoal = goal > used;
    $("goalbox").hidden = !showGoal;
    if (showGoal) {
      $("goalh").textContent = "Still to earn by " + fmt(goal) + " orbs (" + fmt(goal - used) + " more)";
      fill($("togo"), totals(rows.filter((r) => r.orbs > used && r.orbs <= goal)));
    }
    for (const tr of tbody.children) {
      const o = Number(tr.dataset.orbs);
      tr.className = o <= used ? "earned" : next && o === next.orbs ? "next" : "";
    }
  }
  $("used").addEventListener("input", update);
  $("goal").addEventListener("input", update);
  update();
}

load().then(run);
