async function load() {
  try {
    const r = await fetch("dragon.json", { cache: "no-store" });
    if (r.ok) { const d = await r.json(); if (Array.isArray(d) && d.length) return d; }
  } catch (e) { /* use the built-in list */ }
  return SEED;
}

const fmt = (n) => n.toLocaleString("en-US");
const same = (a, b) => a.item === b.item && a.qty === b.qty;

load().then((rows) => {
  // Rewards identical on every row are shown once, not repeated in each row.
  const shared = rows[0].rewards.slice(1).filter((f, i) => rows.every((r) => r.rewards[i + 1] && same(r.rewards[i + 1], f)));
  document.getElementById("shared").textContent = shared.length
    ? "Every milestone also gives: " + shared.map((x) => x.item + " ×" + fmt(x.qty)).join(", ") + "." : "";
  const tbody = document.getElementById("rows");
  for (const r of rows) {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.className = "n"; a.textContent = fmt(r.orbs);
    const b = document.createElement("td");
    for (const x of r.rewards.filter((x) => !shared.some((s) => same(s, x)))) {
      const d = document.createElement("div"); d.textContent = x.item + " ×" + fmt(x.qty); b.appendChild(d);
    }
    tr.append(a, b); tbody.appendChild(tr);
  }
});
