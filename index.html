<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Snail codes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2e6;--ink:#1a2a20;--muted:#55645a;--line:#c9d4bf;--card:#e3eada;--accent:#2d6a4f;--on-accent:#ffffff;--flash:#c9e46b;--flash-ink:#1a2a20;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101913;--ink:#e4eee1;--muted:#97a89b;--line:#2a3a2f;--card:#18241c;--accent:#7fcf9f;--on-accent:#0e1a12;--flash:#c9e46b;--flash-ink:#16210f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101913;--ink:#e4eee1;--muted:#97a89b;--line:#2a3a2f;--card:#18241c;--accent:#7fcf9f;--on-accent:#0e1a12;--flash:#c9e46b;--flash-ink:#16210f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:42rem;margin:0 auto;padding:2rem 1.25rem 4rem}
h1{font-size:clamp(2.25rem,8vw,3.5rem);line-height:1;letter-spacing:-.03em;font-weight:800;margin:0 0 .75rem}
.lede{color:var(--muted);margin:0 0 2.5rem;max-width:34rem}
section{margin-bottom:2.5rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem;border-bottom:2px solid var(--ink);padding-bottom:.5rem}
h2{font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.01em}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.5rem}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.all{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:.4rem .85rem;font-weight:600;white-space:nowrap}
.code{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.65rem .8rem;font-weight:600;letter-spacing:.03em;transition:background-color .15s,border-color .15s}
.code:hover{border-color:var(--accent)}
.code.done{background:var(--flash);color:var(--flash-ink);border-color:var(--flash)}
.note{color:var(--muted);font-size:.9rem;margin-top:3rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.code{transition:none}}
nav{display:flex;gap:1.25rem;flex-wrap:wrap;margin-bottom:2rem;font-weight:600}nav a{color:var(--ink);text-decoration:none;padding-bottom:.15rem;border-bottom:2px solid transparent}nav a:hover{border-color:var(--line)}nav a[aria-current]{border-color:var(--accent)}a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <nav><a href="index.html" aria-current="page">Codes</a><a href="dragon.html">Ultimate Divine Dragon</a><a href="bandaid.html">Under the Bandaid</a></nav>
  <h1>Super Snail codes</h1>
  <p class="lede">Tap a code to copy it, or copy a whole month at once and paste it straight into the game.</p>
  <div id="list"></div>
  <p class="note">Unofficial, fan-made list.</p>
  <div class="sr" id="status" role="status" aria-live="polite"></div>
</main>
<script>
// Fallback data; mirrors codes.json. When codes.json sits next to this page it is loaded instead.
const SEED = [
  ["2026-10-28","NO TRICKS JUST LOOT"],["2026-10-28","SHELLS AFTER DARK"],["2026-10-28","SNAIL NIGHT SHIFT"],["2026-10-28","AUTUMN GRIND MODE"],
  ["2026-10-21","COZY FALL LOOT"],["2026-10-21","OCTOBER DROP INCOMING"],["2026-10-21","SPOOKY BUFF ACTIVE"],["2026-10-21","FALL INTO THE GRIND"],
  ["2026-10-14","SHELLS GET SPOOKY"],["2026-10-14","TRICK OR LOOT"],["2026-10-14","PUMPKIN POWER ONLINE"],["2026-10-14","SNAIL SEASON SHIFT"],
  ["2026-10-07","OCTOBER SHELL MODE"],["2026-10-07","SPOOKY LOOT SEASON"],["2026-10-07","FALL GRIND ACTIVATED"],["2026-10-07","SNAILTOBER IS HERE"]
].map(([postedOn, code]) => ({ postedOn, code }));

async function load() {
  try {
    const r = await fetch("codes.json", { cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d) && d.length) return d.map(({ code, postedOn }) => ({ code, postedOn }));
    }
  } catch (e) { /* use the built-in list */ }
  return SEED;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  const t = document.createElement("textarea");
  t.value = text; t.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(t); t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  t.remove();
  return ok;
}

const status = document.getElementById("status");
function announce(msg) { status.textContent = ""; setTimeout(() => (status.textContent = msg), 50); }

function render(codes) {
  const months = new Map();
  for (const c of codes) {
    const key = c.postedOn.slice(0, 7);
    if (!months.has(key)) months.set(key, []);
    months.get(key).push(c.code);
  }
  const list = document.getElementById("list");
  for (const key of [...months.keys()].sort().reverse()) {
    const items = months.get(key);
    const label = new Date(key + "-01T00:00:00Z").toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });

    const sec = document.createElement("section");
    const head = document.createElement("div"); head.className = "head";
    const h2 = document.createElement("h2"); h2.textContent = label + " codes";
    const all = document.createElement("button"); all.className = "all"; all.type = "button";
    all.textContent = "Copy all " + items.length;
    all.addEventListener("click", async () => {
      const ok = await copy(items.join("\n"));
      all.textContent = ok ? "Copied" : "Copy failed";
      announce(ok ? "Copied " + items.length + " codes" : "Copy failed");
      setTimeout(() => (all.textContent = "Copy all " + items.length), 1400);
    });
    head.append(h2, all);

    const ul = document.createElement("ul");
    for (const code of items) {
      const li = document.createElement("li");
      const b = document.createElement("button"); b.className = "code"; b.type = "button"; b.textContent = code;
      b.addEventListener("click", async () => {
        const ok = await copy(code);
        if (ok) { b.classList.add("done"); setTimeout(() => b.classList.remove("done"), 1200); }
        announce(ok ? "Copied " + code : "Copy failed");
      });
      li.appendChild(b); ul.appendChild(li);
    }
    sec.append(head, ul); list.appendChild(sec);
  }
}

load().then(render);
</script>
</body>
</html>
