async function load() {
  try {
    const r = await fetch("bandaid.json", { cache: "no-store" });
    if (r.ok) { const d = await r.json(); if (Array.isArray(d) && d.length) return d; }
  } catch (e) { /* use the built-in list */ }
  return SEED;
}

const fmt = (n) => n.toLocaleString("en-US");
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

load().then((rows) => {
  const tbody = document.getElementById("rows");
  for (const r of rows) {
    const tr = el("tr"), first = el("td");
    first.append(el("div", r.no + ". " + r.boss, "name"), el("div", r.requirements, "req"));
    tr.append(first, el("td", fmt(r.check), "n"), el("td", r.rewards));
    tbody.appendChild(tr);
  }
});
