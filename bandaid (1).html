<style>

a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.lede{color:var(--muted);margin:0 0 2rem;max-width:34rem}
.tool{display:flex;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem}
label{display:flex;flex-direction:column;gap:.3rem;font-weight:600;font-size:.95rem}

.next-line{font-size:1.15rem;font-weight:600;margin:0 0 1.75rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.75rem;margin-bottom:2.5rem}
.sum ul{list-style:none;margin:0;padding:0}
.sum li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px solid var(--line)}
.sum li span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:.5rem .55rem;border-bottom:1px solid var(--line);vertical-align:top}
th{border-bottom:2px solid var(--ink);font-weight:600}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.name{font-weight:800}
.req{color:var(--muted);font-size:.88rem}
@media (max-width:30rem){table{font-size:.85rem}th,td{padding:.45rem .3rem}}
.note{color:var(--muted);font-size:.9rem;margin-top:3rem}

async function load() {
  try {
    const r = await fetch("bandaid.json", { cache: "no-store" });
    if (r.ok) { const d = await r.json(); if (Array.isArray(d) && d.length) return d; }
  } catch (e) { /* use the built-in list */ }
  return SEED;
}

const fmt = (n) => n.toLocaleString("en-US");
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };

load().then((rows) => {
  const tbody = document.getElementById("rows");
  for (const r of rows) {
    const tr = el("tr"), first = el("td");
    first.append(el("div", r.no + ". " + r.boss, "name"), el("div", r.requirements, "req"));
    tr.append(first, el("td", fmt(r.check), "n"), el("td", r.rewards));
    tbody.appendChild(tr);
  }
});
</script>
